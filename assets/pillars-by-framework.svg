<text x="628" y="163.0" font-size="12.5" fill="#0b0b0b">Availability</text>
<circle cx="613" cy="188.5" r="9" fill="#1baf7a" opacity="0.15"/>
<text x="613" y="192.5" font-size="10.5" font-weight="700" fill="#1baf7a" text-anchor="middle">2</text>
<text x="628" y="192.5" font-size="12.5" fill="#0b0b0b">Resilience</text>
<circle cx="613" cy="218.0" r="9" fill="#1baf7a" opacity="0.15"/>
<text x="613" y="222.0" font-size="10.5" font-weight="700" fill="#1baf7a" text-anchor="middle">3</text>
<text x="628" y="222.0" font-size="12.5" fill="#0b0b0b">Reliability</text>
<circle cx="613" cy="247.5" r="9" fill="#1baf7a" opacity="0.15"/>
<text x="613" y="251.5" font-size="10.5" font-weight="700" fill="#1baf7a" text-anchor="middle">4</text>
<text x="628" y="251.5" font-size="12.5" fill="#0b0b0b">Accuracy</text>
<circle cx="613" cy="277.0" r="9" fill="#1baf7a" opacity="0.15"/>
<text x="613" y="281.0" font-size="10.5" font-weight="700" fill="#1baf7a" text-anchor="middle">5</text>
<text x="628" y="281.0" font-size="12.5" fill="#0b0b0b">Safety</text>
<circle cx="613" cy="306.5" r="9" fill="#1baf7a" opacity="0.15"/>
<text x="613" y="310.5" font-size="10.5" font-weight="700" fill="#1baf7a" text-anchor="middle">6</text>
<text x="628" y="310.5" font-size="12.5" fill="#0b0b0b">Security</text>
<circle cx="613" cy="336.0" r="9" fill="#1baf7a" opacity="0.15"/>
<text x="613" y="340.0" font-size="10.5" font-weight="700" fill="#1baf7a" text-anchor="middle">7</text>
<text x="628" y="340.0" font-size="12.5" fill="#0b0b0b">Privacy</text>
<rect x="872" y="78" width="260" height="417.5" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)" stroke-width="1.5"/>
<rect x="872" y="78" width="260" height="6" rx="3" fill="#eda100"/>
<text x="890" y="112" font-size="14.5" font-weight="700" fill="#0b0b0b">AUSTRALIA'S AI ETHICS</text>
<text x="890" y="131" font-size="11.5" fill="#898781">8 principles, condensed to 5 for Phase 1</text>
<line x1="890" y1="142" x2="1114" y2="142" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>
<circle cx="897" cy="159" r="9" fill="#eda100" opacity="0.15"/>
<text x="897" y="163" font-size="10.5" font-weight="700" fill="#eda100" text-anchor="middle">1</text>
<text x="912" y="163.0" font-size="12.5" fill="#0b0b0b">Human, societal and</text>
<text x="912" y="178.5" font-size="12.5" fill="#0b0b0b">environmental wellbeing</text>
<circle cx="897" cy="204.0" r="9" fill="#eda100" opacity="0.15"/>
<text x="897" y="208.0" font-size="10.5" font-weight="700" fill="#eda100" text-anchor="middle">2</text>
<text x="912" y="208.0" font-size="12.5" fill="#0b0b0b">Human-centred values</text>
<circle cx="897" cy="233.5" r="9" fill="#eda100" opacity="0.15"/>
<text x="897" y="237.5" font-size="10.5" font-weight="700" fill="#eda100" text-anchor="middle">3</text>
<text x="912" y="237.5" font-size="12.5" fill="#0b0b0b">Fairness</text>
<circle cx="897" cy="263.0" r="9" fill="#eda100" opacity="0.15"/>
<text x="897" y="267.0" font-size="10.5" font-weight="700" fill="#eda100" text-anchor="middle">4</text>
<text x="912" y="267.0" font-size="12.5" fill="#0b0b0b">Privacy protection and</text>
<text x="912" y="282.5" font-size="12.5" fill="#0b0b0b">security</text>
<circle cx="897" cy="308.0" r="9" fill="#eda100" opacity="0.15"/>
<text x="897" y="312.0" font-size="10.5" font-weight="700" fill="#eda100" text-anchor="middle">5</text>
<text x="912" y="312.0" font-size="12.5" fill="#0b0b0b">Reliability and safety</text>
<circle cx="897" cy="337.5" r="9" fill="#eda100" opacity="0.15"/>
<text x="897" y="341.5" font-size="10.5" font-weight="700" fill="#eda100" text-anchor="middle">6</text>
<text x="912" y="341.5" font-size="12.5" fill="#0b0b0b">Transparency and</text>
<text x="912" y="357.0" font-size="12.5" fill="#0b0b0b">explainability</text>
<circle cx="897" cy="382.5" r="9" fill="#eda100" opacity="0.15"/>
<text x="897" y="386.5" font-size="10.5" font-weight="700" fill="#eda100" text-anchor="middle">7</text>
<text x="912" y="386.5" font-size="12.5" fill="#0b0b0b">Contestability</text>
<circle cx="897" cy="412.0" r="9" fill="#eda100" opacity="0.15"/>
<text x="897" y="416.0" font-size="10.5" font-weight="700" fill="#eda100" text-anchor="middle">8</text>
<text x="912" y="416.0" font-size="12.5" fill="#0b0b0b">Accountability</text>
